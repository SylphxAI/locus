name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  # Every native build selects one literal owned profile. Linux arm64 is
  # cross-compiled with Zig on the standard owned Linux profile.
  build-darwin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    name: Native ${{ matrix.target }}
    runs-on: [self-hosted, sylphx, macos, standard]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-native-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-native-${{ matrix.target }}-

      - name: Build release natives
        run: |
          set -euo pipefail
          cargo build --release -p coderag-mcp-server -p coderag-cli --target ${{ matrix.target }}
          mkdir -p native-out
          for name in locus-mcp-server locus-cli; do
            bin="target/${{ matrix.target }}/release/${name}"
            test -f "$bin"
            chmod +x "$bin"
            file "$bin" || true
            test "$(wc -c < "$bin")" -gt 100000
            cp "$bin" "native-out/${name}"
            chmod +x "native-out/${name}"
          done

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderag-native-${{ matrix.target }}
          path: native-out/
          if-no-files-found: error
          retention-days: 7

  build-linux-x64:
    name: Native x86_64-unknown-linux-gnu
    runs-on: sylphx-linux-standard

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-native-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-native-x86_64-unknown-linux-gnu-

      - name: Build release natives
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          cargo install cargo-zigbuild --version 0.23.0 --locked
          cargo zigbuild --release -p coderag-mcp-server -p coderag-cli --target "${target}.2.17"
          mkdir -p native-out
          for name in locus-mcp-server locus-cli; do
            bin="target/${target}/release/${name}"
            test -f "$bin"
            chmod +x "$bin"
            file "$bin" || true
            test "$(wc -c < "$bin")" -gt 100000
            cp "$bin" "native-out/${name}"
            chmod +x "native-out/${name}"
          done

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderag-native-x86_64-unknown-linux-gnu
          path: native-out/
          if-no-files-found: error
          retention-days: 7

  build-linux-arm64:
    name: Native aarch64-unknown-linux-gnu
    runs-on: sylphx-linux-standard

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-native-aarch64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-native-aarch64-unknown-linux-gnu-

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Cross-compile release natives
        run: |
          set -euo pipefail
          target=aarch64-unknown-linux-gnu
          # The package promise is glibc >= 2.17, the oldest arm64 glibc ABI.
          cargo zigbuild --release -p coderag-mcp-server -p coderag-cli --target "${target}.2.17"
          mkdir -p native-out
          for name in locus-mcp-server locus-cli; do
            bin="target/${target}/release/${name}"
            test -f "$bin"
            chmod +x "$bin"
            bash scripts/verify-linux-arm64-artifact.sh "$bin"
            cp "$bin" "native-out/${name}"
            chmod +x "native-out/${name}"
          done

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderag-native-aarch64-unknown-linux-gnu
          path: native-out/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-darwin, build-linux-x64, build-linux-arm64]
    # Call publish-npm directly. The release.yml shim pins
    # `bunx @changesets/cli version` on Node 20. Unpinned latest is Changesets
    # 3.x, whose bin calls enableCompileCache(), which Node 20 does not have,
    # so the version PR never opens. Iris publishes with a local CLI on Node 22.
    uses: SylphxAI/.github/.github/workflows/publish-npm.yml@main
    with:
      skip-build: true
      download-artifacts: true
      artifacts-path: artifacts
      node-version: "22"
      # Local 2.31.1. Do not bunx @changesets/cli without a pin.
      version-command: bun run version-packages
      # Assemble natives here, not before the version command. changesets/action
      # commits every dirty file, and the assembled binaries are tracked.
      publish-command: bun run publish-packages
      post-publish-command: bun scripts/verify-multiarch-readback.ts
    secrets: inherit
